name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
      reviewer:
        description: "Reviewer model"
        required: true
        default: "mistral-small-2603"
        type: choice
        options:
          - mistral-small-2603
          - mistral-large-latest
          - zai-glm-5-3
      temperature:
        description: "Sampling temperature (0 = deterministic)"
        required: false
        default: "0"
      max_diff_bytes:
        description: "Max diff size in bytes sent to the model"
        required: false
        default: "100000"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ai-review
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Mistral review
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          REVIEWER: ${{ github.event.pull_request.number && 'mistral-small-2603' || inputs.reviewer }}
          TEMPERATURE: ${{ inputs.temperature || '0' }}
          MAX_DIFF: ${{ inputs.max_diff_bytes || '100000' }}
        run: |
          set -euo pipefail
          gh pr diff "$PR_NUMBER" --allow-escape-sequences 2>/dev/null \
            | sed 's/\x1B\[[0-9;?]*[a-zA-Z]//g; s/\x1B][0-9];[^\x07]*\x07//g' > /tmp/pr.diff \
            || gh pr diff "$PR_NUMBER" \
            | sed 's/\x1B\[[0-9;?]*[a-zA-Z]//g; s/\x1B][0-9];[^\x07]*\x07//g' > /tmp/pr.diff
          head -c "$MAX_DIFF" /tmp/pr.diff > /tmp/pr-trimmed.diff
          if [ ! -s /tmp/pr-trimmed.diff ]; then
            echo "Empty diff, skipping review."
            exit 0
          fi

          if [ ! -s /tmp/pr.diff ]; then
            echo "Failed to fetch PR diff." >&2
            exit 1
          fi

          BODY=$(jq -n \
            --arg model "$REVIEWER" \
            --argjson temp "$TEMPERATURE" \
            --arg diff "$(cat /tmp/pr-trimmed.diff)" \
            '{
              model: $model,
              temperature: $temp,
              response_format: {type: "json_object"},
              messages: [
                {role: "system", content: "You are an expert code reviewer. Review the pull request diff provided by the user. Report only real issues: bugs, security problems, performance problems, and clear style violations. Be concise. Respond with a JSON object exactly of the form {\"findings\": [{\"file\": \"<path as shown in the diff>\", \"line\": <line number in the NEW version of the file>, \"comment\": \"<short explanation>\"}]}. The line number must refer to a line that is added or unchanged in the new version (a + or context line in the diff). Do not reference deleted lines. If there are no significant issues, respond with {\"findings\": []}."},
                {role: "user", content: ("Review this diff:\n\n" + $diff)}
              ]
            }')

          curl -sS --max-time 600 "https://api.mistral.ai/v1/chat/completions" \
            -H "Authorization: Bearer $MISTRAL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$BODY" > /tmp/response.json

          jq -e '.choices[0].message.content' /tmp/response.json > /dev/null \
            || { echo "Model API returned no content:" >&2; cat /tmp/response.json >&2; exit 1; }

          export HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)

          python3 - <<'PYEOF'
          import json, re, os, sys, urllib.request, urllib.error

          repo = os.environ["GH_REPO"]
          pr = os.environ["PR_NUMBER"]
          reviewer = os.environ["REVIEWER"]
          head_sha = os.environ["HEAD_SHA"]
          token = os.environ["GH_TOKEN"]

          content = json.load(open("/tmp/response.json"))["choices"][0]["message"]["content"]
          content = re.sub(r"^```(json)?|```$", "", content.strip(), flags=re.MULTILINE).strip()
          try:
              findings = json.loads(content).get("findings", [])
          except json.JSONDecodeError:
              open("/tmp/summary.md", "w").write(f"## AI Review (`{reviewer}`)\n\n{content}\n")
              summary_only = True
          else:
              summary_only = False
              valid = {}
              path, new_line = None, None
              for raw in open("/tmp/pr.diff", errors="replace"):
                  line = raw.rstrip("\n")
                  if line.startswith("+++ b/"):
                      path, new_line = line[6:], None
                  elif line.startswith("@@") and line in raw:
                      m = re.search(r"\+(\d+)(?:,\d+)? @@", line)
                      new_line = int(m.group(1)) if m else None
                  elif path is not None and new_line is not None:
                      if line.startswith("+"):
                          valid.setdefault(path, set()).add(new_line)
                          new_line += 1
                      elif line.startswith(" "):
                          valid.setdefault(path, set()).add(new_line)
                          new_line += 1

              inline, unanchored = [], []
              for f in findings:
                  file_ = str(f.get("file", "")).strip()
                  try:
                      ln = int(f.get("line"))
                  except (TypeError, ValueError):
                      ln = None
                  cmt = str(f.get("comment", "")).strip()
                  if not cmt:
                      continue
                  if file_ in valid and ln in valid[file_]:
                      inline.append({"path": file_, "line": ln, "side": "RIGHT", "body": cmt})
                  else:
                      unanchored.append((file_, ln, cmt))

              summary = [f"## AI Review (`{reviewer}`)", ""]
              if not inline and not unanchored:
                  summary.append("No significant issues.")
              else:
                  summary.append(f"{len(inline)} inline comment(s), {len(unanchored)} unanchored finding(s).")
                  for file_, ln, cmt in unanchored:
                      loc = f"{file_}:{ln}" if ln else (file_ or "unknown")
                      summary.append(f"- **{loc}** — {cmt}")
              open("/tmp/summary.md", "w").write("\n".join(summary))

              payload = json.dumps({
                  "commit_id": head_sha,
                  "event": "COMMENT",
                  "body": "\n".join(summary),
                  "comments": inline,
              }).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/pulls/{pr}/reviews",
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      resp.read()
              except urllib.error.HTTPError as e:
                  sys.stderr.write(f"GitHub review POST failed: {e.code} {e.reason}: {e.read().decode(errors='replace')[:500]}\n")
                  raise

          if summary_only:
              raise SystemExit(0)
          PYEOF
