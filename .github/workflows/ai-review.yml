name: AI PR Review

on:
  workflow_run:
    workflows: [Dev prerelease]
    types: [completed]
    branches: ["**"]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
      reviewer:
        description: "Reviewer model"
        required: true
        default: "mistral-small-2603"
        type: choice
        options:
          - mistral-small-2603
          - mistral-large-2512
          - mistral-large-4
          - zai-glm-5-3
      temperature:
        description: "Sampling temperature (0 = deterministic)"
        required: false
        default: "0"
      max_diff_bytes:
        description: "Max diff size in bytes sent to the model"
        required: false
        default: "100000"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    # Review only when the test workflow has completed successfully.
    # Note: Dev prerelease has a paths filter; PRs that change nothing in
    # its paths (e.g. workflow-only PRs) never trigger it and thus never
    # get an AI review. Use workflow_dispatch to review such a PR manually.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ai-review
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Mistral review
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number }}
          REVIEWER: ${{ (github.event_name == 'workflow_run' && 'mistral-small-2603') || inputs.reviewer }}
          TEMPERATURE: ${{ inputs.temperature || '0' }}
          MAX_DIFF: ${{ inputs.max_diff_bytes || '100000' }}
        run: |
          set -euo pipefail
          gh pr diff "$PR_NUMBER" --allow-escape-sequences 2>/dev/null \
            | sed 's/\x1B\[[0-9;?]*[a-zA-Z]//g; s/\x1B][0-9];[^\x07]*\x07//g' > /tmp/pr.diff \
            || gh pr diff "$PR_NUMBER" \
            | sed 's/\x1B\[[0-9;?]*[a-zA-Z]//g; s/\x1B][0-9];[^\x07]*\x07//g' > /tmp/pr.diff
          head -c "$MAX_DIFF" /tmp/pr.diff > /tmp/pr-trimmed.diff
          if [ ! -s /tmp/pr-trimmed.diff ]; then
            echo "Empty diff, skipping review."
            exit 0
          fi

          if [ ! -s /tmp/pr.diff ]; then
            echo "Failed to fetch PR diff." >&2
            exit 1
          fi

          # Context package: PR title/description, repo guidance, changed file contents
          gh pr view "$PR_NUMBER" --json title,body --jq '"# " + .title + "\n\n" + (.body // "")' \
            > /tmp/pr-context.md || true
          for f in README.md; do
            if [ -f "$f" ]; then
              echo -e "\n--- Repo guidance: $f ---" >> /tmp/pr-context.md
              head -c 20000 "$f" >> /tmp/pr-context.md
            fi
          done
          grep -x -E '^\+\+\+ b/.*' /tmp/pr.diff | cut -c7- | sort -u > /tmp/changed-files.txt
          while IFS= read -r f; do
            if [ -f "$f" ] && [ "$(head -c 300000 "$f" | wc -c)" -gt 0 ]; then
              echo -e "\n--- Full content of $f (new version) ---" >> /tmp/pr-context.md
              head -c 30000 "$f" >> /tmp/pr-context.md
              if [ "$(wc -c < "$f")" -gt 30000 ]; then
                echo -e "\n[... file truncated at 30000 of $(wc -c < "$f") bytes; diff hunks cover the rest ...]" >> /tmp/pr-context.md
              fi
              echo -e "\n--- end of $f ---" >> /tmp/pr-context.md
            fi
          done < /tmp/changed-files.txt
          head -c 150000 /tmp/pr-context.md > /tmp/pr-trimmed-context.md

          # Previous AI review findings (to avoid duplication)
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER/comments" --paginate 2>/dev/null \
            | jq -r '[.[] | select(.user.login == "github-actions[bot]") | .body] | join("\n---\n")' \
            > /tmp/prev-findings.txt || true
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER/reviews" --paginate 2>/dev/null \
            | jq -r '[.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("## AI Review")) | .body] | join("\n---\n")' \
            >> /tmp/prev-findings.txt || true
          head -c 50000 /tmp/prev-findings.txt > /tmp/prev-trimmed.txt || true

          if [ -s /tmp/prev-trimmed.txt ]; then
            printf 'Findings from your previous AI review of this PR (already reported; do NOT report these again unless the underlying code changed and the issue persists):\n\n' > /tmp/prev-block.txt
            cat /tmp/prev-trimmed.txt >> /tmp/prev-block.txt
            printf '\n\n' >> /tmp/prev-block.txt
          else
            : > /tmp/prev-block.txt
          fi
          jq -n \
            --arg model "$REVIEWER" \
            --argjson temp "$TEMPERATURE" \
            --rawfile diff /tmp/pr-trimmed.diff \
            --rawfile context /tmp/pr-trimmed-context.md \
            --rawfile prevblock /tmp/prev-block.txt \
            '{
              model: $model,
              temperature: $temp,
              response_format: {type: "json_object"},
              messages: [
                {role: "system", content: "You are an expert code reviewer. Review the pull request whose diff and context are provided by the user. Use the PR description, repo guidance, and the full contents of the changed files to understand intent and surrounding code; judge issues in that context rather than from the diff hunks alone. Report only real issues: bugs, security problems, performance problems, and clear style violations (follow the repo guidance where given). Rank findings by confidence and severity, and report AT MOST 4 findings — only the most significant ones worth the attention of a human reviewer. Do not report minor, speculative, or stylistic nitpicks. Be concise. Respond with a JSON object exactly of the form {\"findings\": [{\"file\": \"<path as shown in the diff>\", \"line\": <line number in the NEW version of the file>, \"comment\": \"<short explanation>\"}]}. The line number must refer to a line that is added or unchanged in the new version (a + or context line in the diff). Do not reference deleted lines. If there are no significant issues, respond with {\"findings\": []}."},
                {role: "user", content: ($prevblock + "PR context (title, description, repo guidance, changed file contents):\n\n" + $context + "\n\nReview this diff:\n\n" + $diff)}
              ]
            }' > /tmp/request.json

          curl -sS --max-time 600 "https://api.mistral.ai/v1/chat/completions" \
            -H "Authorization: Bearer $MISTRAL_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/request.json > /tmp/response.json

          jq -e '.choices[0].message.content' /tmp/response.json > /dev/null \
            || { echo "Model API returned no content:" >&2; cat /tmp/response.json >&2; exit 1; }

          # Second pass: verify findings with Mistral Large 3 to drop false positives
          jq -r '.choices[0].message.content' /tmp/response.json \
            | sed 's/^```\(json\)\?//; s/```$//' > /tmp/findings.json
          FINDINGS_COUNT=$(jq '.findings | length' /tmp/findings.json 2>/dev/null || echo 1)
          if [ "$FINDINGS_COUNT" -gt 0 ]; then
            jq -n \
              --rawfile findings /tmp/findings.json \
              --rawfile context /tmp/pr-trimmed-context.md \
              --rawfile diff /tmp/pr-trimmed.diff \
              '{
                model: "mistral-large-2512",
                temperature: 0,
                response_format: {type: "json_object"},
                messages: [
                  {role: "system", content: "You are a strict second-pass verifier for a code review. You receive PR context, the diff, and findings from a first-pass reviewer. For each finding, decide whether it is genuinely correct and significant given the full context: the referenced code exists, the claimed problem is real (not a false positive), it is not already handled elsewhere in the file, and it is worth the attention of a human reviewer. Return a JSON object exactly of the form {\"findings\": [...]} containing ONLY the verified findings (same file/line/comment fields, at most 4). If none survive, return {\"findings\": []}."},
                  {role: "user", content: ("PR context:\n\n" + $context + "\n\nDiff:\n\n" + $diff + "\n\nFirst-pass findings to verify:\n\n" + $findings)}
                ]
              }' > /tmp/verify-request.json
            curl -sS --max-time 600 "https://api.mistral.ai/v1/chat/completions" \
              -H "Authorization: Bearer $MISTRAL_API_KEY" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/verify-request.json > /tmp/verify-response.json
            jq -r '.choices[0].message.content' /tmp/verify-response.json \
              | sed 's/^```\(json\)\?//; s/```$//' > /tmp/verified-findings.json \
              || cp /tmp/findings.json /tmp/verified-findings.json
            jq -e '.findings' /tmp/verified-findings.json > /dev/null 2>&1 \
              || cp /tmp/findings.json /tmp/verified-findings.json
          else
            cp /tmp/findings.json /tmp/verified-findings.json
          fi

          export HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)

          python3 - <<'PYEOF'
          import json, re, os, sys, urllib.request, urllib.error

          def api(method, url, data=None):
              req = urllib.request.Request(
                  f"https://api.github.com{url}",
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "Content-Type": "application/json",
                  },
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      body = resp.read()
                      return json.loads(body) if body else None
              except urllib.error.HTTPError as e:
                  sys.stderr.write(f"GitHub {method} {url} failed: {e.code} {e.reason}: {e.read().decode(errors='replace')[:500]}\n")
                  if e.code == 404:
                      return None
                  raise

          def cleanup_old_reviews():
              reviews = api("GET", f"/repos/{os.environ['GH_REPO']}/pulls/{os.environ['PR_NUMBER']}/reviews?per_page=100") or []
              for rev in reviews:
                  if rev["user"]["login"] != "github-actions[bot]":
                      continue
                  if not (rev.get("body") or "").startswith("## AI Review"):
                      continue
                  if rev.get("state") in ("APPROVED", "CHANGES_REQUESTED"):
                      api("PUT", f"/repos/{os.environ['GH_REPO']}/pulls/{os.environ['PR_NUMBER']}/reviews/{rev['id']}/dismissals",
                          {"message": "Superseded by a newer AI review."})
                  else:
                      api("PUT", f"/repos/{os.environ['GH_REPO']}/pulls/{os.environ['PR_NUMBER']}/reviews/{rev['id']}",
                          {"body": "## AI Review (superseded)\n\nSuperseded by a newer AI review."})
              comments = api("GET", f"/repos/{os.environ['GH_REPO']}/pulls/{os.environ['PR_NUMBER']}/comments?per_page=100") or []
              for cmt in comments:
                  if cmt["user"]["login"] == "github-actions[bot]":
                      api("DELETE", f"/repos/{os.environ['GH_REPO']}/pulls/comments/{cmt['id']}")

          cleanup_old_reviews()

          repo = os.environ["GH_REPO"]
          pr = os.environ["PR_NUMBER"]
          reviewer = os.environ["REVIEWER"]
          head_sha = os.environ["HEAD_SHA"]
          token = os.environ["GH_TOKEN"]

          content = open("/tmp/verified-findings.json").read().strip()
          content = re.sub(r"^```(json)?|```$", "", content.strip(), flags=re.MULTILINE).strip()
          try:
              findings = json.loads(content).get("findings", [])
          except json.JSONDecodeError:
              open("/tmp/summary.md", "w").write(f"## AI Review (`{reviewer}`)\n\n{content}\n")
              summary_only = True
          else:
              summary_only = False
              valid = {}
              path, new_line = None, None
              for raw in open("/tmp/pr.diff", errors="replace"):
                  line = raw.rstrip("\n")
                  if line.startswith("+++ b/"):
                      path, new_line = line[6:], None
                  elif line.startswith("@@"):
                      m = re.search(r"\+(\d+)(?:,\d+)? @@", line)
                      new_line = int(m.group(1)) if m else None
                  elif path is not None and new_line is not None:
                      if line.startswith("+"):
                          valid.setdefault(path, set()).add(new_line)
                          new_line += 1
                      elif line.startswith(" "):
                          valid.setdefault(path, set()).add(new_line)
                          new_line += 1

              inline, unanchored = [], []
              for f in findings:
                  file_ = str(f.get("file", "")).strip()
                  try:
                      ln = int(f.get("line"))
                  except (TypeError, ValueError):
                      ln = None
                  cmt = str(f.get("comment", "")).strip()
                  if not cmt:
                      continue
                  if file_ in valid and ln in valid[file_]:
                      inline.append({"path": file_, "line": ln, "side": "RIGHT", "body": cmt})
                  else:
                      unanchored.append((file_, ln, cmt))

              summary = [f"## AI Review (`{reviewer}`)", ""]
              if not inline and not unanchored:
                  summary.append("No significant issues.")
              else:
                  summary.append(f"{len(inline)} inline comment(s), {len(unanchored)} unanchored finding(s).")
                  for file_, ln, cmt in unanchored:
                      loc = f"{file_}:{ln}" if ln else (file_ or "unknown")
                      summary.append(f"- **{loc}** — {cmt}")
              open("/tmp/summary.md", "w").write("\n".join(summary))

              api("POST", f"/repos/{repo}/pulls/{pr}/reviews", {
                  "commit_id": head_sha,
                  "event": "REQUEST_CHANGES" if (inline or unanchored) else "COMMENT",
                  "body": "\n".join(summary),
                  "comments": inline,
              })

          if summary_only:
              raise SystemExit(0)
          PYEOF
