name: Dev prerelease

on:
  push:
    branches: [main]
    paths:
      - 'custom_components/**'
      - 'manifest.json'
      - 'hacs.json'
      - 'requirements_test.txt'
  pull_request:
    branches: [main]
    paths:
      - 'custom_components/**'
      - 'manifest.json'
      - 'hacs.json'
      - 'requirements_test.txt'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'main' }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run tests
        run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'main' }}

      - name: Compute next version
        if: github.event_name == 'push'
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Derive the next build number from the highest existing 0.1.x tag
          # so it keeps incrementing across branch switches or run-counter
          # resets (e.g. dev ended at build 40; main continues at 41).
          last="$(gh release list --json tagName -q '.[].tagName' \
            | grep -E '^0\.1\.[0-9]+$' | sort -V | tail -1 || true)"
          n="${last#0.1.}"
          if [ -z "$n" ] || ! [[ "$n" =~ ^[0-9]+$ ]]; then
            n=0
          fi
          echo "VERSION=0.1.$((n + 1))" >> "$GITHUB_ENV"
          echo "version=0.1.$((n + 1))" >> "$GITHUB_OUTPUT"

      - name: Stamp version into manifests
        if: github.event_name == 'push'
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os

          version = os.environ["VERSION"]
          for path in (
              "custom_components/stroompeil_ha_addon/manifest.json",
              "manifest.json",
          ):
              with open(path, encoding="utf-8") as fh:
                  data = json.load(fh)
              data["version"] = version
              with open(path, "w", encoding="utf-8") as fh:
                  json.dump(data, fh, indent=2)
                  fh.write("\n")
          PYEOF

      - name: Build HACS zip
        run: |
          (cd custom_components/stroompeil_ha_addon && zip -r "$GITHUB_WORKSPACE/stroompeil-ha-addon.zip" . -x '*.pyc' -x '*__pycache__*')

      - name: Upload zip artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: stroompeil-ha-addon
          path: stroompeil-ha-addon.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0

      - name: Download zip artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: stroompeil-ha-addon

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          set -euo pipefail
          # Collect the commits included in this release: everything on main
          # since the tag of the most recent existing release.
          prev="$(gh release list --json tagName -q '.[0].tagName' || true)"
          if [ -n "$prev" ] && git rev-parse --verify --quiet "$prev^{commit}" >/dev/null; then
            git log --reverse --no-merges "$prev..HEAD" \
              --format='---%n%H%n%s%n%b' > /tmp/commits.txt
          else
            git log --reverse --no-merges -n 20 HEAD \
              --format='---%n%H%n%s%n%b' > /tmp/commits.txt
          fi
          python3 - <<'PYEOF'
          import json
          import os
          import re
          import subprocess
          import urllib.request

          api_key = os.environ.get("MISTRAL_API_KEY", "")

          def load_commits(path):
              with open(path, encoding="utf-8") as fh:
                  raw = fh.read()
              commits = []
              for block in raw.split("---\n")[1:]:
                  lines = block.strip("\n").split("\n")
                  if len(lines) < 2:
                      continue
                  sha, subject = lines[0].strip(), lines[1].strip()
                  body = "\n".join(lines[2:]).strip()
                  try:
                      diff = subprocess.run(
                          ["git", "show", "--format=", "--no-color", sha],
                          capture_output=True, text=True, timeout=60,
                      ).stdout
                  except Exception:
                      diff = ""
                  commits.append({
                      "sha": sha,
                      "subject": subject,
                      "body": body,
                      "diff": diff[:20000],
                  })
              return commits

          commits = load_commits("/tmp/commits.txt")
          if not commits:
              commits = [{"sha": "", "subject": "Automated build", "body": "", "diff": ""}]

          notes = None
          if api_key:
              request = json.dumps({
                  "model": "mistral-small-2603",
                  "temperature": 0,
                  "response_format": {"type": "json_object"},
                  "messages": [
                      {
                          "role": "system",
                          "content": (
                              "You write release notes for a Home Assistant integration "
                              "aimed at end users. For each changed commit listed, write "
                              "a short one or two line note describing what changed from "
                              "the user's perspective: new features, fixes, behavior "
                              "changes. Plain, non-technical language; no commit hashes, "
                              "no internal jargon, no markdown headers. "
                              "Respond with a JSON object exactly of the form "
                              '{\"notes\": [\"<note for commit 1>\", \"<note for commit 2>\", ...]}'
                              'with exactly one entry per listed commit, in the same order.'
                          ),
                      },
                      {
                          "role": "user",
                          "content": "Changed commits in this release:\n\n" + json.dumps(commits, indent=2),
                      },
                  ],
              }).encode()
              try:
                  req = urllib.request.Request(
                      "https://api.mistral.ai/v1/chat/completions",
                      data=request,
                      headers={
                          "Authorization": f"Bearer {api_key}",
                          "Content-Type": "application/json",
                      },
                      method="POST",
                  )
                  with urllib.request.urlopen(req, timeout=300) as resp:
                      content = json.loads(resp.read())["choices"][0]["message"]["content"]
                  content = re.sub(r"^```(json)?|```$", "", content.strip())
                  parsed = json.loads(content)
                  candidate = parsed.get("notes")
                  if isinstance(candidate, list) and len(candidate) == len(commits):
                      notes = [str(n).strip() for n in candidate]
              except Exception as err:
                  print(f"Release note generation failed ({err}); falling back to commit subjects.")

          if notes is None:
              notes = [c["subject"] for c in commits]

          lines = []
          for note in notes:
              for line in note.splitlines():
                  line = line.strip().lstrip("-*").strip()
                  if line:
                      lines.append(f"- {line}")
          if not lines:
              lines = ["- Automated build."]

          with open("/tmp/release-notes.md", "w", encoding="utf-8") as fh:
              fh.write("\n".join(lines) + "\n")
          PYEOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Keep only the 5 most recent releases; delete older ones.
          gh release list --json tagName \
            -q '.[].tagName' \
            | sort -rV \
            | tail -n +6 \
            | while read -r tag; do
                gh release delete "$tag" --cleanup-tag -y || true
              done
          # Create a new release with a unique, incrementing tag so HACS
          # detects it as a new version and offers an update.
          build="${VERSION#0.1.}"
          gh release create "$VERSION" stroompeil-ha-addon.zip \
            --target main \
            --title "Dev build ${build}" \
            --notes-file /tmp/release-notes.md
